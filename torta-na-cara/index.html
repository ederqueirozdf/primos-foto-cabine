<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torta na Cara dos Primos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
  :root {
    --studio: #121A5C;
    --studio-hi: #2A3AA8;
    --cream: #FFF3D6;
    --crust: #E7B66A;
    --berry: #E23B4E;
    --berry-deep: #8E1630;
    --custard: #FFC83D;
    --right: #17C964;
    --right-deep: #0B8A42;
    --ink: #1D1446;
    --display: "Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif;
    --text: "Fredoka", "Nunito", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    min-height: 100dvh;
    background:
      radial-gradient(60% 55% at 50% 0%, rgba(120, 140, 255, .35), transparent 70%),
      repeating-linear-gradient(90deg, rgba(255,255,255,.025) 0 2px, transparent 2px 120px),
      var(--studio);
    color: var(--cream);
    font-family: var(--text);
    overflow-x: hidden;
  }

  .stage {
    min-height: 100dvh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    grid-template-columns: minmax(0, 1fr);
    gap: clamp(14px, 2.4vh, 28px);
    padding: clamp(14px, 2.5vh, 28px) clamp(16px, 3vw, 48px);
    max-width: 1500px;
    margin: 0 auto;
  }

  /* ---------- top bar ---------- */
  .top {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-right: auto;
  }
  .brand svg { width: 46px; height: 46px; flex: none; }
  .brand h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(1.5rem, 2.6vw, 2.2rem);
    letter-spacing: .01em;
    color: var(--cream);
    text-shadow: 0 3px 0 var(--berry), 0 6px 0 var(--berry-deep);
  }
  .chip {
    font-family: var(--text);
    font-weight: 700;
    font-size: 1rem;
    color: var(--ink);
    background: var(--custard);
    padding: 6px 16px;
    border-radius: 999px;
  }
  .count { font-weight: 500; opacity: .8; font-size: 1rem; }
  .icon-btn {
    width: 42px; height: 42px;
    display: grid; place-items: center;
    border-radius: 12px;
    border: 2px solid rgba(255,243,214,.25);
    background: rgba(255,255,255,.06);
    color: var(--cream);
    cursor: pointer;
  }
  .icon-btn:hover { background: rgba(255,255,255,.14); }
  .icon-btn svg { width: 22px; height: 22px; }

  /* ---------- board ---------- */
  .board {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: clamp(18px, 3.5vh, 40px);
  }

  .marquee {
    position: relative;
    padding: 22px;
    border-radius: 18px;
    background: linear-gradient(180deg, var(--berry), var(--berry-deep));
    box-shadow: 0 18px 50px rgba(0,0,0,.35);
  }
  .bulbs { position: absolute; inset: 0; pointer-events: none; }
  .bulb {
    position: absolute;
    width: 10px; height: 10px;
    margin: -5px 0 0 -5px;
    border-radius: 50%;
    background: #FFE9A8;
    box-shadow: 0 0 8px 2px rgba(255, 200, 61, .8);
    animation: blink 1.2s steps(1) infinite;
  }
  .bulb.b { animation-delay: -.6s; }
  @keyframes blink { 0% { opacity: 1; } 50% { opacity: .22; } }

  .marquee.fast .bulb {
    animation: chase .48s linear infinite;
    animation-delay: calc((7 - var(--k)) * -.06s);
  }
  @keyframes chase {
    0% { opacity: 1; transform: scale(1.25); }
    25%, 100% { opacity: .18; transform: scale(1); }
  }
  .marquee.win .bulb {
    background: #A8FFCB;
    box-shadow: 0 0 10px 3px rgba(23, 201, 100, .85);
    animation: blink .9s steps(1) infinite;
  }
  .marquee.win .bulb.b { animation-delay: -.45s; }

  .question {
    position: relative;
    background: var(--cream);
    color: var(--ink);
    border-radius: 8px;
    min-height: clamp(150px, 24vh, 260px);
    display: grid;
    place-items: center;
    padding: clamp(18px, 3vh, 36px) clamp(20px, 4vw, 64px);
    text-align: center;
  }
  .question p {
    margin: 0;
    font-weight: 700;
    font-size: clamp(1.6rem, 3.6vw, 3.3rem);
    line-height: 1.15;
    max-width: 28ch;
    text-wrap: balance;
  }

  .answers {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: clamp(12px, 2vh, 22px) clamp(14px, 2.4vw, 36px);
  }

  .slot { filter: drop-shadow(0 8px 0 rgba(0,0,0,.28)); transition: filter .3s, opacity .4s; }
  .opt {
    --cut: 26px;
    --edge: var(--crust);
    --face: var(--cream);
    --fg: var(--ink);
    width: 100%;
    display: block;
    padding: 4px;
    border: 0;
    background: var(--edge);
    clip-path: polygon(var(--cut) 0, calc(100% - var(--cut)) 0, 100% 50%, calc(100% - var(--cut)) 100%, var(--cut) 100%, 0 50%);
    cursor: pointer;
    font: inherit;
    color: var(--fg);
    transition: background .2s;
  }
  .face {
    display: flex;
    align-items: center;
    gap: 16px;
    min-height: clamp(64px, 9vh, 92px);
    padding: 8px calc(var(--cut) + 8px) 8px calc(var(--cut) - 6px);
    background: var(--face);
    clip-path: polygon(calc(var(--cut) - 2px) 0, calc(100% - var(--cut) + 2px) 0, 100% 50%, calc(100% - var(--cut) + 2px) 100%, calc(var(--cut) - 2px) 100%, 0 50%);
    text-align: left;
    transition: background .2s, color .2s;
  }
  .badge {
    flex: none;
    width: clamp(40px, 5vh, 52px); height: clamp(40px, 5vh, 52px);
    display: grid; place-items: center;
    border-radius: 50%;
    background: var(--berry);
    color: var(--cream);
    font-family: var(--display);
    font-size: clamp(1.3rem, 2.4vh, 1.7rem);
    transition: background .2s, color .2s;
  }
  .txt {
    font-weight: 600;
    font-size: clamp(1.15rem, 2vw, 1.75rem);
    line-height: 1.15;
  }

  .opt:hover .face { background: #FFFBEF; }
  .opt:focus-visible { outline: none; }
  .slot:has(.opt:focus-visible) { filter: drop-shadow(0 0 0 #fff) drop-shadow(0 0 6px #fff) drop-shadow(0 8px 0 rgba(0,0,0,.28)); }

  .opt.selected { --edge: var(--berry); }
  .opt.selected .face, .opt.scan .face { background: var(--custard); }
  .opt.scan { --edge: #fff; }

  .opt.correct { --edge: var(--right-deep); }
  .opt.correct .face { animation: right-blink .9s steps(1) infinite; }
  .opt.correct .badge { background: #fff; color: var(--right-deep); }
  @keyframes right-blink {
    0% { background: var(--right); color: #fff; }
    50% { background: var(--cream); color: var(--ink); }
  }
  .slot.glow { filter: drop-shadow(0 0 18px rgba(23, 201, 100, .9)) drop-shadow(0 8px 0 rgba(0,0,0,.28)); }

  .opt.wrong { --edge: var(--berry-deep); }
  .opt.wrong .face { background: var(--berry); color: #fff; }
  .opt.wrong .badge { background: var(--berry-deep); }
  .slot.shake { animation: shake .5s; }
  @keyframes shake {
    20% { transform: translateX(-10px); } 40% { transform: translateX(9px); }
    60% { transform: translateX(-6px); } 80% { transform: translateX(4px); }
  }
  .slot.dim { opacity: .35; filter: saturate(.3); }

  .revealed .opt { cursor: default; }
  .revealed .opt:not(.correct):not(.wrong):hover .face { background: var(--cream); }

  /* entrance */
  .enter .question p { animation: pop .5s cubic-bezier(.2, 1.4, .4, 1) both; }
  .enter .slot { animation: slide-in .45s cubic-bezier(.2, 1.2, .4, 1) both; }
  .enter .slot:nth-child(odd) { --from: -60px; }
  .enter .slot:nth-child(even) { --from: 60px; }
  .enter .slot:nth-child(1) { animation-delay: .15s; }
  .enter .slot:nth-child(2) { animation-delay: .23s; }
  .enter .slot:nth-child(3) { animation-delay: .31s; }
  .enter .slot:nth-child(4) { animation-delay: .39s; }
  @keyframes pop { from { opacity: 0; transform: scale(.85); } }
  @keyframes slide-in { from { opacity: 0; transform: translateX(var(--from)); } }

  /* ---------- bottom bar ---------- */
  .bottom {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 16px;
  }
  .controls { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn {
    font-family: var(--display);
    font-size: clamp(1.15rem, 1.8vw, 1.5rem);
    letter-spacing: .01em;
    padding: 14px 26px;
    border-radius: 16px;
    border: 0;
    cursor: pointer;
    color: var(--cream);
    background: var(--berry);
    box-shadow: 0 6px 0 var(--berry-deep);
    transition: transform .1s, box-shadow .1s, opacity .2s;
  }
  .btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 var(--berry-deep); }
  .btn.alt { background: var(--custard); color: var(--ink); box-shadow: 0 6px 0 #B9861A; }
  .btn.alt:active:not(:disabled) { box-shadow: 0 2px 0 #B9861A; }
  .btn.ghost { background: transparent; color: var(--cream); box-shadow: inset 0 0 0 2px rgba(255,243,214,.35); }
  .btn:disabled { opacity: .35; cursor: default; }
  .btn:focus-visible, .icon-btn:focus-visible, .team button:focus-visible, .team input:focus-visible {
    outline: 3px solid #fff; outline-offset: 3px;
  }

  .team {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: 16px;
    background: rgba(255,255,255,.06);
    border: 2px solid transparent;
    transition: border-color .25s, background .25s;
    justify-self: start;
  }
  .team.right { justify-self: end; }
  .team.turn { border-color: var(--custard); background: rgba(255, 200, 61, .12); }
  .team input {
    width: 8.5em;
    background: transparent;
    border: 0;
    color: var(--cream);
    font: 600 1.05rem var(--text);
    border-radius: 6px;
    padding: 2px 4px;
  }
  .team .score {
    font-family: var(--display);
    font-size: 2rem;
    min-width: 1.6em;
    text-align: center;
    color: var(--custard);
  }
  .team button {
    width: 34px; height: 34px;
    border-radius: 10px;
    border: 0;
    background: rgba(255,255,255,.12);
    color: var(--cream);
    font: 700 1.2rem var(--text);
    cursor: pointer;
  }
  .team button:hover { background: rgba(255,255,255,.22); }
  .turn-tag { font-size: .85rem; color: var(--custard); font-weight: 600; visibility: hidden; }
  .team.turn .turn-tag { visibility: visible; }

  .keys { text-align: center; font-size: .85rem; opacity: .55; margin-top: 6px; grid-column: 1 / -1; }
  kbd {
    font-family: var(--text); font-weight: 600;
    border: 1px solid rgba(255,243,214,.4); border-radius: 5px; padding: 0 5px;
  }

  /* ---------- splat ---------- */
  .splat {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    pointer-events: none;
    z-index: 20;
  }
  .splat[hidden] { display: none; }
  .splat-inner { position: relative; width: min(80vw, 640px); animation: splat-in 1.9s ease-out both; }
  .splat svg { width: 100%; height: auto; display: block; }
  .splat span {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    font-family: var(--display);
    font-size: clamp(2rem, 6vw, 4.2rem);
    color: var(--berry);
    transform: rotate(-6deg);
  }
  @keyframes splat-in {
    0% { transform: scale(.2) rotate(-20deg); opacity: 0; }
    12% { transform: scale(1.08) rotate(3deg); opacity: 1; }
    20% { transform: scale(1) rotate(0); }
    75% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(40px); }
  }

  canvas.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 15; }

  /* ---------- responsive ---------- */
  @media (max-width: 860px) {
    .answers { grid-template-columns: minmax(0, 1fr); }
    .bottom { grid-template-columns: 1fr 1fr; }
    .controls { grid-column: 1 / -1; order: -1; }
    .team.right { justify-self: end; }
    .team input { width: 6.5em; }
    .keys { display: none; }
  }
  @media (max-width: 520px) {
    .top { gap: 10px; }
    .brand h1 { font-size: 1.3rem; }
    .opt { --cut: 18px; }
    .bottom { grid-template-columns: 1fr; }
    .team, .team.right { justify-self: stretch; }
    .count { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .enter .question p, .enter .slot, .slot.shake, .splat-inner { animation: none; }
    .bulb, .marquee.fast .bulb { animation: none; }
    .opt.correct .face { animation-duration: 1.6s; }
  }
</style>
</head>
<body>
<main class="stage">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <ellipse cx="32" cy="44" rx="28" ry="10" fill="#B9861A"/>
        <path d="M4 40c0-12 13-20 28-20s28 8 28 20c0 6-13 10-28 10S4 46 4 40z" fill="#E7B66A"/>
        <path d="M8 36c2-10 12-15 24-15s22 5 24 15c-4 3-9 1-12 4s-7 0-10 3-6-1-9 1-7-2-9-4-6 0-8-4z" fill="#FFF3D6"/>
        <circle cx="32" cy="22" r="6" fill="#E23B4E"/>
        <path d="M32 16c1-4 4-6 7-6" stroke="#2E7D32" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      </svg>
      <h1>TORTA NA CARA DOS PRIMOS</h1>
    </div>
    <span class="chip" id="category">Geografia</span>
    <span class="count" id="count">Pergunta 1 de 80</span>
    <button class="icon-btn" id="soundBtn" aria-label="Desligar som" title="Som (S)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path id="soundWave" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/><path id="soundOff" d="M16 9l6 6M22 9l-6 6" style="display:none"/></svg>
    </button>
    <button class="icon-btn" id="fsBtn" aria-label="Tela cheia" title="Tela cheia (F)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </header>

  <section class="board" id="board" aria-live="polite">
    <div class="marquee" id="marquee">
      <div class="bulbs" id="bulbs"></div>
      <div class="question"><p id="questionText"></p></div>
    </div>
    <div class="answers" id="answers"></div>
  </section>

  <footer class="bottom">
    <div class="team turn" id="team0">
      <div>
        <input value="Equipe 1" aria-label="Nome da equipe 1">
        <div class="turn-tag">Na vez</div>
      </div>
      <button data-d="-1" aria-label="Tirar ponto">−</button>
      <span class="score">0</span>
      <button data-d="1" aria-label="Dar ponto">+</button>
    </div>

    <div class="controls">
      <button class="btn ghost" id="passBtn">Passa</button>
      <button class="btn" id="revealBtn">Revelar resposta</button>
      <button class="btn alt" id="nextBtn">Próxima pergunta</button>
    </div>

    <div class="team right" id="team1">
      <div>
        <input value="Equipe 2" aria-label="Nome da equipe 2">
        <div class="turn-tag">Na vez</div>
      </div>
      <button data-d="-1" aria-label="Tirar ponto">−</button>
      <span class="score">0</span>
      <button data-d="1" aria-label="Dar ponto">+</button>
    </div>

    <p class="keys">
      <kbd>A</kbd>–<kbd>D</kbd> marcar resposta · <kbd>Espaço</kbd> revelar · <kbd>→</kbd> próxima · <kbd>P</kbd> passa a vez
    </p>
  </footer>
</main>

<div class="splat" id="splat" hidden>
  <div class="splat-inner">
    <svg viewBox="0 0 400 320" aria-hidden="true">
      <path fill="#FFF3D6" stroke="#E7B66A" stroke-width="6" d="M196 30c34-6 44 26 74 20s58-12 66 18-28 40-6 62 52 40 26 66-56 4-62 34 24 62-10 66-30-38-62-38-44 44-76 34 0-46-30-60-74 12-80-20 40-34 22-56-56-32-34-58 52-4 66-30 4-56 34-52 40 20 72 14z"/>
      <circle cx="350" cy="250" r="14" fill="#FFF3D6" stroke="#E7B66A" stroke-width="4"/>
      <circle cx="44" cy="70" r="10" fill="#FFF3D6" stroke="#E7B66A" stroke-width="4"/>
      <circle cx="80" cy="282" r="8" fill="#FFF3D6" stroke="#E7B66A" stroke-width="4"/>
      <circle cx="200" cy="140" r="12" fill="#E23B4E"/>
    </svg>
    <span>Torta na cara!</span>
  </div>
</div>

<canvas class="confetti" id="confetti"></canvas>

<script>
// [categoria, pergunta, [resposta certa, erradas...]]
const QUESTIONS = [
  ["Geografia", "Qual é a capital do Brasil?", ["Brasília", "Rio de Janeiro", "São Paulo", "Salvador"]],
  ["Geografia", "Qual é o maior oceano do mundo?", ["Pacífico", "Atlântico", "Índico", "Ártico"]],
  ["Geografia", "Em qual continente fica o Egito?", ["África", "Ásia", "Europa", "Oceania"]],
  ["Geografia", "Qual é o maior país do mundo em território?", ["Rússia", "Canadá", "China", "Brasil"]],
  ["Geografia", "Qual é a capital da Argentina?", ["Buenos Aires", "Montevidéu", "Santiago", "Lima"]],
  ["Geografia", "Qual é o maior rio do mundo em volume de água?", ["Amazonas", "Nilo", "Mississippi", "São Francisco"]],
  ["Geografia", "Sem contar o Distrito Federal, quantos estados tem o Brasil?", ["26", "27", "25", "24"]],
  ["Geografia", "Qual é a capital do Japão?", ["Tóquio", "Pequim", "Seul", "Osaka"]],
  ["Geografia", "Qual país tem o formato de uma bota?", ["Itália", "Portugal", "Grécia", "Espanha"]],
  ["Geografia", "Em qual cidade fica o Cristo Redentor?", ["Rio de Janeiro", "Salvador", "São Paulo", "Belo Horizonte"]],
  ["Geografia", "Em qual país fica a Torre Eiffel?", ["França", "Itália", "Inglaterra", "Alemanha"]],
  ["Geografia", "Qual é a montanha mais alta do mundo?", ["Monte Everest", "K2", "Aconcágua", "Kilimanjaro"]],
  ["Geografia", "Qual é o maior deserto quente do mundo?", ["Saara", "Atacama", "Gobi", "Kalahari"]],
  ["Ciências", "Qual planeta é conhecido como Planeta Vermelho?", ["Marte", "Júpiter", "Vênus", "Saturno"]],
  ["Ciências", "Qual é o planeta mais próximo do Sol?", ["Mercúrio", "Vênus", "Terra", "Marte"]],
  ["Ciências", "Qual gás as plantas absorvem para fazer fotossíntese?", ["Gás carbônico", "Oxigênio", "Nitrogênio", "Hélio"]],
  ["Ciências", "Qual é a fórmula química da água?", ["H₂O", "CO₂", "O₂", "NaCl"]],
  ["Ciências", "A quantos graus a água ferve ao nível do mar?", ["100 °C", "50 °C", "80 °C", "120 °C"]],
  ["Ciências", "Qual é a estrela mais próxima da Terra?", ["O Sol", "Sirius", "Alfa Centauri", "Estrela Polar"]],
  ["Ciências", "Qual é o maior planeta do Sistema Solar?", ["Júpiter", "Saturno", "Netuno", "Terra"]],
  ["Ciências", "Qual é o satélite natural da Terra?", ["A Lua", "O Sol", "Marte", "Vênus"]],
  ["Ciências", "Quantas estações do ano existem?", ["4", "2", "3", "5"]],
  ["Corpo humano", "Quantos ossos tem o corpo humano adulto?", ["206", "150", "300", "256"]],
  ["Corpo humano", "Qual órgão bombeia o sangue pelo corpo?", ["Coração", "Pulmão", "Fígado", "Rim"]],
  ["Corpo humano", "Qual é o maior órgão do corpo humano?", ["Pele", "Fígado", "Intestino", "Cérebro"]],
  ["Corpo humano", "Quantos dentes tem um adulto, contando os sisos?", ["32", "28", "24", "36"]],
  ["Corpo humano", "Qual órgão usamos para respirar?", ["Pulmão", "Estômago", "Coração", "Rim"]],
  ["Animais", "Qual é o maior mamífero do mundo?", ["Baleia-azul", "Elefante-africano", "Girafa", "Tubarão-baleia"]],
  ["Animais", "Quantas patas tem uma aranha?", ["8", "6", "10", "4"]],
  ["Animais", "Qual animal é conhecido como o rei da selva?", ["Leão", "Tigre", "Elefante", "Gorila"]],
  ["Animais", "Em que inseto a lagarta se transforma?", ["Borboleta", "Abelha", "Libélula", "Joaninha"]],
  ["Animais", "Qual é o animal terrestre mais rápido?", ["Guepardo", "Leão", "Cavalo", "Avestruz"]],
  ["Animais", "O pinguim é um tipo de quê?", ["Ave", "Mamífero", "Peixe", "Réptil"]],
  ["Animais", "Quantas patas tem um inseto?", ["6", "8", "4", "10"]],
  ["Animais", "Qual animal produz o mel?", ["Abelha", "Vespa", "Formiga", "Borboleta"]],

  ["Conhecimentos gerais", "Qual é a moeda oficial do Brasil?", ["Real", "Peso", "Cruzeiro", "Dólar"]],
  ["Conhecimentos gerais", "Qual moeda é usada na maioria dos países da União Europeia?", ["Euro", "Libra", "Dólar", "Franco"]],
  ["Conhecimentos gerais", "Qual é a árvore símbolo do Brasil?", ["Pau-brasil", "Ipê", "Jacarandá", "Araucária"]],

  ["Tecnologia", "Qual empresa criou o iPhone?", ["Apple", "Samsung", "Nokia", "Motorola"]],

  ["Cinema e TV", "Qual é o nome do pai do Nemo em Procurando Nemo?", ["Marlin", "Gill", "Bruce", "Crush"]],
  ["Cinema e TV", "Qual super-herói é chamado de Homem de Aço?", ["Superman", "Batman", "Homem de Ferro", "Hulk"]],
  ["Cinema e TV", "Qual é o nome do grande vilão de Harry Potter?", ["Voldemort", "Darth Vader", "Sauron", "Coringa"]],
  ["Cinema e TV", "Quem é o melhor amigo do Bob Esponja?", ["Patrick", "Lula Molusco", "Seu Sirigueijo", "Plankton"]],
  ["Cinema e TV", "Qual é o nome do famoso ratinho criado por Walt Disney?", ["Mickey", "Jerry", "Ligeirinho", "Topo Gigio"]],
];

const LETTERS = ["A", "B", "C", "D"];
const $ = (s) => document.querySelector(s);
const board = $("#board"), marquee = $("#marquee"), bulbsEl = $("#bulbs");
const answersEl = $("#answers"), qText = $("#questionText");
const revealBtn = $("#revealBtn"), nextBtn = $("#nextBtn"), passBtn = $("#passBtn");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

const store = {
  get(k, d) { try { const v = localStorage.getItem("torta:" + k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem("torta:" + k, JSON.stringify(v)); } catch {} },
};

let deck = store.get("deck", null);
let pos = store.get("pos", 0);
if (!Array.isArray(deck) || deck.length !== QUESTIONS.length) { deck = shuffle(QUESTIONS.map((_, i) => i)); pos = 0; }

let current = null, selected = null, revealed = false, busy = false;
let soundOn = store.get("sound", true);

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/* ---------- answer slots ---------- */
const slots = LETTERS.map((L, i) => {
  const slot = document.createElement("div");
  slot.className = "slot";
  slot.innerHTML = `<button class="opt" data-i="${i}"><span class="face"><span class="badge">${L}</span><span class="txt"></span></span></button>`;
  answersEl.append(slot);
  slot.querySelector(".opt").addEventListener("click", () => select(i));
  return slot;
});

function render() {
  const [cat, q, opts] = QUESTIONS[deck[pos]];
  current = { cat, q, opts: shuffle(opts.map((text, i) => ({ text, correct: i === 0 }))) };
  selected = null; revealed = false;
  $("#category").textContent = cat;
  $("#count").textContent = `Pergunta ${pos + 1} de ${deck.length}`;
  qText.textContent = q;
  slots.forEach((slot, i) => {
    slot.className = "slot";
    const opt = slot.querySelector(".opt");
    opt.className = "opt";
    opt.setAttribute("aria-label", `${LETTERS[i]}: ${current.opts[i].text}`);
    slot.querySelector(".txt").textContent = current.opts[i].text;
  });
  marquee.classList.remove("win", "fast");
  board.classList.remove("revealed", "enter");
  void board.offsetWidth;
  board.classList.add("enter");
  revealBtn.disabled = false;
  store.set("deck", deck); store.set("pos", pos);
}

function select(i) {
  if (revealed || busy) return;
  selected = selected === i ? null : i;
  slots.forEach((s, j) => s.querySelector(".opt").classList.toggle("selected", j === selected));
  if (selected !== null) tone(520, .08, "triangle", .12);
}

async function reveal() {
  if (revealed || busy) return;
  busy = true;
  revealBtn.disabled = true;
  const correct = current.opts.findIndex((o) => o.correct);
  const opts = slots.map((s) => s.querySelector(".opt"));

  if (!reduced) {
    marquee.classList.add("fast");
    const roll = drumroll();
    let delay = 70, i = 0;
    while (delay < 340) {
      opts.forEach((o, j) => o.classList.toggle("scan", j === i % 4));
      tick();
      await sleep(delay);
      delay *= 1.11; i++;
    }
    opts.forEach((o) => o.classList.remove("scan"));
    roll.stop();
    await sleep(260);
  }

  marquee.classList.remove("fast");
  marquee.classList.add("win");
  board.classList.add("revealed");
  opts[correct].classList.remove("selected");
  opts[correct].classList.add("correct");
  slots[correct].classList.add("glow");

  const missed = selected !== null && selected !== correct;
  slots.forEach((s, j) => {
    if (j === correct) return;
    if (j === selected) { opts[j].classList.remove("selected"); opts[j].classList.add("wrong"); s.classList.add("shake"); }
    else s.classList.add("dim");
  });

  if (missed) { buzz(); splat(); }
  else { fanfare(); confetti(slots[correct]); }

  revealed = true; busy = false;
}

function next() {
  if (busy) return;
  pos++;
  if (pos >= deck.length) { deck = shuffle(deck); pos = 0; }
  render();
}

/* ---------- marquee bulbs ---------- */
function buildBulbs() {
  const w = marquee.offsetWidth, h = marquee.offsetHeight, inset = 11, gap = 26;
  const W = w - inset * 2, H = h - inset * 2;
  const nx = Math.max(2, Math.round(W / gap)), ny = Math.max(2, Math.round(H / gap));
  const pts = [];
  for (let i = 0; i < nx; i++) pts.push([inset + (W * i) / nx, inset]);
  for (let i = 0; i < ny; i++) pts.push([inset + W, inset + (H * i) / ny]);
  for (let i = 0; i < nx; i++) pts.push([inset + W - (W * i) / nx, inset + H]);
  for (let i = 0; i < ny; i++) pts.push([inset, inset + H - (H * i) / ny]);
  const frag = document.createDocumentFragment();
  pts.forEach(([x, y], i) => {
    const b = document.createElement("i");
    b.className = "bulb " + (i % 2 ? "b" : "a");
    b.style.left = x + "px"; b.style.top = y + "px";
    b.style.setProperty("--k", i % 8);
    frag.append(b);
  });
  bulbsEl.replaceChildren(frag);
}
new ResizeObserver(buildBulbs).observe(marquee);

/* ---------- teams ---------- */
const teams = [$("#team0"), $("#team1")];
const saved = store.get("teams", null);
teams.forEach((t, i) => {
  const score = t.querySelector(".score"), input = t.querySelector("input");
  if (saved?.[i]) { input.value = saved[i].name; score.textContent = saved[i].score; }
  t.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
    score.textContent = Math.max(0, +score.textContent + +b.dataset.d);
    saveTeams();
  }));
  input.addEventListener("input", saveTeams);
});
let turn = store.get("turn", 0);
function setTurn(t) { turn = t; teams.forEach((el, i) => el.classList.toggle("turn", i === turn)); store.set("turn", turn); }
function saveTeams() { store.set("teams", teams.map((t) => ({ name: t.querySelector("input").value, score: +t.querySelector(".score").textContent }))); }
setTurn(turn);
passBtn.addEventListener("click", () => { setTurn(1 - turn); tone(330, .12, "square", .06); });

/* ---------- sound ---------- */
let ctx;
function ac() { if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === "suspended") ctx.resume(); return ctx; }
function tone(freq, dur, type = "sine", vol = .2, when = 0) {
  if (!soundOn) return;
  const c = ac(), t = c.currentTime + when, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .02);
}
function tick() { tone(1200, .03, "square", .04); }
function drumroll() {
  if (!soundOn) return { stop() {} };
  const c = ac(), len = c.sampleRate * 3, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (0.55 + 0.45 * Math.sin(i / c.sampleRate * Math.PI * 2 * 22));
  const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  src.buffer = buf; f.type = "lowpass"; f.frequency.value = 900;
  g.gain.setValueAtTime(.05, c.currentTime); g.gain.linearRampToValueAtTime(.22, c.currentTime + 2);
  src.connect(f).connect(g).connect(c.destination); src.start();
  return { stop() { g.gain.cancelScheduledValues(c.currentTime); g.gain.setValueAtTime(g.gain.value, c.currentTime); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + .08); src.stop(c.currentTime + .1); } };
}
function fanfare() { [523, 659, 784, 1047].forEach((f, i) => tone(f, i === 3 ? .7 : .18, "triangle", .22, i * .12)); }
function buzz() {
  if (!soundOn) return;
  const c = ac(), t = c.currentTime, o = c.createOscillator(), g = c.createGain();
  o.type = "sawtooth"; o.frequency.setValueAtTime(160, t); o.frequency.linearRampToValueAtTime(80, t + .6);
  g.gain.setValueAtTime(.18, t); g.gain.exponentialRampToValueAtTime(.001, t + .65);
  o.connect(g).connect(c.destination); o.start(t); o.stop(t + .7);
}
function syncSoundIcon() {
  $("#soundWave").style.display = soundOn ? "" : "none";
  $("#soundOff").style.display = soundOn ? "none" : "";
  $("#soundBtn").setAttribute("aria-label", soundOn ? "Desligar som" : "Ligar som");
}
$("#soundBtn").addEventListener("click", () => { soundOn = !soundOn; store.set("sound", soundOn); syncSoundIcon(); });
syncSoundIcon();

/* ---------- splat + confetti ---------- */
function splat() {
  if (reduced) return;
  const el = $("#splat");
  el.hidden = false;
  const inner = el.firstElementChild;
  inner.style.animation = "none"; void inner.offsetWidth; inner.style.animation = "";
  setTimeout(() => (el.hidden = true), 1900);
}

const cv = $("#confetti"), cx = cv.getContext("2d");
let parts = [], raf = 0;
function confetti(fromEl) {
  if (reduced) return;
  cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio;
  cx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  const r = fromEl.getBoundingClientRect(), colors = ["#FFF3D6", "#FFC83D", "#E23B4E", "#17C964", "#ffffff"];
  for (let i = 0; i < 140; i++) {
    const a = -Math.PI / 2 + (Math.random() - .5) * 2.2, v = 6 + Math.random() * 9;
    parts.push({ x: r.left + Math.random() * r.width, y: r.top + r.height / 2, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
      s: 6 + Math.random() * 7, rot: Math.random() * 6, vr: (Math.random() - .5) * .4, c: colors[i % colors.length], life: 0 });
  }
  if (!raf) loop();
}
function loop() {
  cx.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter((p) => p.life < 150 && p.y < innerHeight + 40);
  for (const p of parts) {
    p.life++; p.vy += .28; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot);
    cx.globalAlpha = Math.min(1, (150 - p.life) / 40);
    cx.fillStyle = p.c; cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
    cx.restore();
  }
  raf = parts.length ? requestAnimationFrame(loop) : 0;
  if (!raf) cx.clearRect(0, 0, innerWidth, innerHeight);
}

/* ---------- controls ---------- */
revealBtn.addEventListener("click", reveal);
nextBtn.addEventListener("click", next);
$("#fsBtn").addEventListener("click", toggleFs);
function toggleFs() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.();
}

document.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  const idx = ["a", "b", "c", "d"].indexOf(k);
  if (idx >= 0) select(idx);
  else if (["1", "2", "3", "4"].includes(k)) select(+k - 1);
  else if (k === " " || k === "r") { e.preventDefault(); reveal(); }
  else if (k === "arrowright" || k === "n") next();
  else if (k === "p") passBtn.click();
  else if (k === "s") $("#soundBtn").click();
  else if (k === "f") toggleFs();
  else return;
});

render();
</script>
